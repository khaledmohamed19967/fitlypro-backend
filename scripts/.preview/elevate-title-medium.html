:root {
  --bg: #0b0d0f;
  --card: #14171BEB;
  --line: #2A2E35;
  --lime: #ccff01;
  --orange: #f59e2e;
  --orange-line: #c9843a;
  --text: #ffffff;
  --muted: #9AA2AC;
  --silver: #c5cad0;
  --dek: #a8aeb4;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  background: #070809;
  color: var(--text);
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.page {
  position: relative;
  width: 794px;
  height: 1123px;
  overflow: hidden;
  background: var(--bg);
  font-family: Inter, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

.hero {
  position: absolute;
  top: 0;
  right: 0;
  width: 461px;
  height: 640px;
  z-index: 1;
  user-select: none;
}

.slash {
  position: absolute;
  left: 0;
  bottom: 11px;
  width: 794px;
  height: 120px;
  z-index: 3;
  user-select: none;
}

.page::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 16px;
  z-index: 2;
  background: linear-gradient(90deg, #b8e317 0%, #a9d50b 48%, #9cc901 100%);
}

.logo {
  position: absolute;
  z-index: 3;
  left: 32px;
  top: 34px;
  display: flex;
  align-items: flex-end;
  line-height: 1;
}

.logo-f {
  font-style: italic;
  font-weight: 800;
  font-size: 27px;
  letter-spacing: -0.04em;
  color: var(--lime);
  line-height: 0.78;
}

.logo-word {
  margin-left: 1px;
  padding-bottom: 1px;
  font-weight: 700;
  font-size: 23px;
  letter-spacing: -0.04em;
  color: #fff;
}

.kicker {
  position: absolute;
  z-index: 3;
  left: 32px;
  top: 104px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #C9CED5;
}

/* Left column flows: title → dek → overview (no absolute overlap). */
.left-stack {
  position: absolute;
  z-index: 3;
  left: 30px;
  top: 134px;
  width: var(--title-width, 400px);
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 24px;
}

.title-stack {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 18px;
  width: 100%;
}

.title {
  position: static;
  width: 100%;
  max-width: 100%;
  font-size: var(--title-size, 55px);
  font-weight: 800;
  /* Slightly above the original 0.9 so multi-line glyphs don't paint into the dek. */
  line-height: var(--title-line-height, 0.98);
  letter-spacing: -0.02em;
  text-transform: uppercase;
  color: #fff;
  overflow-wrap: anywhere;
  word-break: normal;
  hyphens: manual;
}

.title span {
  color: var(--lime);
}

.dek {
  position: static;
  max-width: 100%;
  font-size: 11.5px;
  font-weight: 400;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #E6E8EA;
}

.overview {
  position: static;
  width: 100%;
  height: 196px;
  display: flex;
  flex-direction: column;
  padding: 0 14px 2px;
  background: var(--card);
  border: 1px solid #CCFF0138;
  border-radius: 16px;
  flex: none;
}

.overview-head {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 46px;
  flex: none;
}

.overview-head svg {
  width: 16px;
  height: 16px;
  color: var(--lime);
  flex: none;
}

.overview-head h2 {
  font-size: 14px;
  font-weight: 650;
  letter-spacing: -0.02em;
}

.overview-rows {
  list-style: none;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.overview-rows li {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  border-top: 1px solid rgba(255, 255, 255, 0.07);
  font-size: 12px;
  letter-spacing: -0.01em;
}

.overview-rows span {
  color: var(--muted);
  font-weight: 500;
}

.overview-rows strong {
  font-weight: 600;
  color: #f3f5f4;
  text-align: right;
}

.overview-rows .lime {
  color: var(--lime);
  font-weight: 700;
}

.stats,
.steps {
  position: absolute;
  z-index: 3;
  left: 30px;
  width: 713px;
  display: grid;
  gap: 9px;
}

.stats {
  top: 850px;
  height: 58px;
  grid-template-columns: repeat(4, 1fr);
}

.steps {
  top: 885px;
  height: 99px;
  grid-template-columns: repeat(3, 1fr);
}

.stat,
.step {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
}

.stat {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  min-width: 0;
}

.stat svg,
.step svg {
  width: 22px;
  height: 22px;
  color: var(--lime);
  flex: none;
}

.stat strong {
  display: block;
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.03em;
}

.stat span {
  display: block;
  margin-top: 4px;
  font-size: 11px;
  line-height: 1;
  color: var(--muted);
  white-space: nowrap;
}

.stat-hot {
  border-color: var(--orange-line);
}

.stat-hot svg {
  color: var(--orange);
}

.step {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 3px;
  padding: 10px 12px 12px;
}

.step svg {
  width: 22px;
  height: 22px;
  margin-bottom: 8px;
}

.step h2 {
  font-size: 14px;
  font-weight: 650;
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin-bottom: 2px;
}

.step p {
  font-size: 11px;
  line-height: 1.2;
  color: var(--muted);
}

@page {
  size: A4;
  margin: 0;
}

@media print {
  html,
  body {
    background: var(--bg);
  }

  body {
    display: block;
  }

  .page {
    margin: 0;
  }
}

* {
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

</style>
</head>
